name: WaferGuard qualification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run qualification tests
        run: python -m pytest -q --junitxml=qualification-results.xml

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qualification-results
          path: qualification-results.xml
          if-no-files-found: warn
